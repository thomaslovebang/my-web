<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC模组自动生成器 - 在线工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .header p {
            color: #666;
            font-size: 1.2em;
        }

        .main-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 200px;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .progress-section {
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 40px;
            background: #e0e0e0;
            border-radius: 20px;
            overflow: hidden;
            margin: 15px 0;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.1em;
        }

        .log-box {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 10px;
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.8;
        }

        .log-entry {
            margin-bottom: 10px;
            padding: 8px;
            border-left: 3px solid #667eea;
            background: rgba(102, 126, 234, 0.1);
        }

        .log-success {
            border-left-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }

        .log-warning {
            border-left-color: #ff9800;
            background: rgba(255, 152, 0, 0.1);
        }

        .log-error {
            border-left-color: #f44336;
            background: rgba(244, 67, 54, 0.1);
        }

        .result-panel {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-top: 20px;
            display: none;
        }

        .result-panel.show {
            display: block;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .file-list {
            background: #f7f9fc;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .file-item {
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .download-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }

        .download-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        @media (max-width: 1024px) {
            .main-area {
                grid-template-columns: 1fr;
            }
        }

        .example-chips {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 15px 0;
        }

        .chip {
            padding: 8px 16px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .chip:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 MC模组自动生成器</h1>
            <p>输入需求，一键生成完整的Minecraft Fabric模组</p>
        </div>

        <div class="main-area">
            <!-- 输入面板 -->
            <div class="panel">
                <h2>📝 配置你的模组</h2>
                
                <div class="input-group">
                    <label>模组名称</label>
                    <input type="text" id="modName" placeholder="例如: GlowingCrystal" value="GlowingCrystal">
                </div>

                <div class="input-group">
                    <label>MC版本</label>
                    <select id="mcVersion">
                        <option value="1.20.1">1.20.1 (推荐)</option>
                        <option value="1.19.4">1.19.4</option>
                        <option value="1.18.2">1.18.2</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>模组需求描述</label>
                    <textarea id="modRequirement" placeholder="详细描述你想要的模组功能...

示例:
做一个发光水晶模组，包含:
- 红/蓝/绿三种颜色的水晶矿石
- 矿石分布在不同Y层
- 挖掘矿石掉落水晶碎片  
- 4个碎片可以合成1个水晶灯(亮度15)"></textarea>
                </div>

                <div class="example-chips">
                    <div class="chip" onclick="loadExample(1)">💎 发光水晶</div>
                    <div class="chip" onclick="loadExample(2)">🔮 魔法宝石</div>
                    <div class="chip" onclick="loadExample(3)">🎨 彩色玻璃</div>
                </div>

                <div class="btn-group">
                    <button class="btn-primary" id="generateBtn" onclick="startGeneration()">
                        🚀 开始生成
                    </button>
                    <button class="btn-secondary" onclick="reset()">🔄 重置</button>
                </div>
            </div>

            <!-- 进度面板 -->
            <div class="panel">
                <h2>⚙️ 生成进度</h2>
                
                <div class="progress-section">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressBar" style="width: 0%;">
                            0%
                        </div>
                    </div>
                    <div id="statusText" style="text-align: center; color: #666; font-size: 1.1em;">
                        等待开始...
                    </div>
                </div>

                <div class="log-box" id="logBox">
                    <div style="color: #999; text-align: center; padding: 50px 20px;">
                        <div style="font-size: 3em; margin-bottom: 20px;">🎮</div>
                        <div>准备就绪，点击"开始生成"启动流水线</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 结果面板 -->
        <div class="result-panel" id="resultPanel">
            <h2>✅ 生成完成！</h2>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="statFiles">0</div>
                    <div>生成文件数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="statLines">0</div>
                    <div>代码行数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="statTime">0</div>
                    <div>耗时(秒)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="statQuality">0</div>
                    <div>质量评分</div>
                </div>
            </div>

            <h3 style="color: #667eea; margin: 30px 0 15px 0;">📁 生成的文件</h3>
            <div class="file-list" id="fileList"></div>

            <div style="text-align: center; margin-top: 30px;">
                <button class="download-btn" onclick="downloadAll()">📦 打包下载全部文件</button>
                <button class="download-btn" onclick="viewExample()">👁️ 查看示例代码</button>
            </div>
        </div>
    </div>

    <script>
        const examples = {
            1: {
                name: "GlowingCrystal",
                desc: `做一个发光水晶模组，Java版1.20.1，包含:
- 红/蓝/绿三种颜色的水晶矿石
- 矿石分布在不同Y层(红深层、蓝中层、绿浅层)
- 挖掘矿石掉落水晶碎片(1-2个，支持时运)
- 4个碎片可以合成1个水晶灯(亮度15)`
            },
            2: {
                name: "MagicGem",
                desc: `做一个魔法宝石模组，包含:
- 火/水/风/土四种元素宝石矿石
- 宝石可以合成魔法杖
- 每种元素有不同的技能效果
- 火焰宝石在下界生成，水元素在海洋，风元素在山地，土元素在平原`
            },
            3: {
                name: "ColoredGlass",
                desc: `添加彩色玻璃模组:
- 红/橙/黄/绿/青/蓝/紫7种颜色的彩色玻璃方块
- 每种颜色有透明和不透明两个版本(共14个方块)
- 使用玻璃+对应染料合成`
            }
        };

        function loadExample(num) {
            const ex = examples[num];
            document.getElementById('modName').value = ex.name;
            document.getElementById('modRequirement').value = ex.desc;
        }

        let currentStep = 0;
        let startTime = 0;

        const pipeline = [
            { name: "初始化项目", duration: 1000, desc: "创建项目目录结构..." },
            { name: "创意规划", duration: 3000, desc: "AI正在设计完整的模组方案..." },
            { name: "任务拆解", duration: 1000, desc: "分配代码/美术/音效任务..." },
            { name: "代码生成", duration: 4000, desc: "生成Java代码、配置文件..." },
            { name: "美术设计", duration: 3000, desc: "设计贴图素材和模型..." },
            { name: "音效设计", duration: 2000, desc: "规划音效方案..." },
            { name: "质量测试", duration: 4000, desc: "测试工程师审查所有产出..." },
            { name: "拼接修复", duration: 3000, desc: "修复问题并拼接所有文件..." },
            { name: "生成文档", duration: 1000, desc: "生成README和说明文档..." },
            { name: "完成", duration: 500, desc: "项目已就绪！" }
        ];

        function log(message, type = 'info') {
            const logBox = document.getElementById('logBox');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${message}`;
            
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateProgress(percent, status) {
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressBar').textContent = Math.round(percent) + '%';
            document.getElementById('statusText').textContent = status;
        }

        async function startGeneration() {
            const modName = document.getElementById('modName').value.trim();
            const modRequirement = document.getElementById('modRequirement').value.trim();
            
            if (!modName || !modRequirement) {
                alert('请填写模组名称和需求描述！');
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> 生成中...';
            
            document.getElementById('logBox').innerHTML = '';
            document.getElementById('resultPanel').classList.remove('show');
            
            startTime = Date.now();
            
            log(`🚀 MC模组自动生成流水线启动`, 'success');
            log(`📝 模组名称: ${modName}`);
            log(`📋 目标版本: ${document.getElementById('mcVersion').value}`);
            log('');

            for (let i = 0; i < pipeline.length; i++) {
                await executeStep(i);
            }

            const totalTime = Math.round((Date.now() - startTime) / 1000);
            
            log('');
            log('🎉 ========== 生成完成！ ==========', 'success');
            log(`⏱️ 总耗时: ${totalTime}秒`);
            log(`📁 输出路径: output/${modName}/`);
            
            showResult(modName, totalTime);
            
            btn.disabled = false;
            btn.textContent = '🔄 重新生成';
        }

        async function executeStep(index) {
            const step = pipeline[index];
            const progress = ((index + 1) / pipeline.length) * 100;
            
            updateProgress(progress, `Step ${index + 1}/${pipeline.length}: ${step.name}`);
            log(`▶️ [${index + 1}/${pipeline.length}] ${step.name}`, 'info');
            log(`   ${step.desc}`);
            
            await new Promise(resolve => setTimeout(resolve, step.duration));
            
            log(`✅ ${step.name} 完成`, 'success');
            
            if (index < pipeline.length - 1) {
                log('');
            }
        }

        function showResult(modName, totalTime) {
            const resultPanel = document.getElementById('resultPanel');
            resultPanel.classList.add('show');
            
            document.getElementById('statFiles').textContent = '42';
            document.getElementById('statLines').textContent = '~500';
            document.getElementById('statTime').textContent = totalTime;
            document.getElementById('statQuality').textContent = '8.5/10';
            
            const files = [
                { name: 'README.md', type: '📄 文档' },
                { name: 'FINAL_SUMMARY.md', type: '📄 文档' },
                { name: '贴图生成指南.md', type: '📄 文档' },
                { name: `${modName}Mod.java`, type: '☕ Java代码' },
                { name: 'ModBlocks.java', type: '☕ Java代码' },
                { name: 'ModItems.java', type: '☕ Java代码' },
                { name: 'ModWorldGen.java', type: '☕ Java代码' },
                { name: 'fabric.mod.json', type: '⚙️ 配置文件' },
                { name: 'zh_cn.json', type: '🌍 语言文件' },
                { name: 'en_us.json', type: '🌍 语言文件' },
                { name: '...还有32个资源文件', type: '📦 资源包' }
            ];
            
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = files.map(file => `
                <div class="file-item">
                    <span>${file.type}</span>
                    <span style="flex: 1;">${file.name}</span>
                </div>
            `).join('');
            
            resultPanel.scrollIntoView({ behavior: 'smooth' });
        }

        function downloadAll() {
            alert('💡 提示: 这是前端演示版本\n\n实际使用时，生成的文件会保存到:\nMC_MOD_GENERATION_SYSTEM/output/YourModName/\n\n你可以直接在文件系统中找到它们。');
        }

        function viewExample() {
            window.open('../examples/GlowingCrystal/', '_blank');
        }

        function reset() {
            document.getElementById('modName').value = '';
            document.getElementById('modRequirement').value = '';
            document.getElementById('logBox').innerHTML = '<div style="color: #999; text-align: center; padding: 50px 20px;"><div style="font-size: 3em; margin-bottom: 20px;">🎮</div><div>准备就绪，点击"开始生成"启动流水线</div></div>';
            document.getElementById('resultPanel').classList.remove('show');
            updateProgress(0, '等待开始...');
        }
    </script>
</body>
</html>
